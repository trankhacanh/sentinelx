spring:
  application:
    name: sentinelx

  # Đọc .env ở thư mục chạy app. "optional:" để không lỗi trên CI/production khi dùng biến môi trường thật.
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:sentinelx}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}   # cố ý KHÔNG có default

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false   # Instant -> "2026-09-19T10:15:30Z"

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

sentinelx:
  security:
    jwt:
      secret: ${JWT_SECRET}          # không có default: thiếu là app không khởi động
      expiration: ${JWT_EXPIRATION:60m}
      issuer: sentinelx
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  events:
    max-future-skew: 5m
    max-payload-bytes: 8192