spring:
  application:
    name: sentinelx


  # Đọc .env ở thư mục chạy app. "optional:" để không lỗi trên CI/production khi dùng biến môi trường thật.
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:sentinelx}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}   # cố ý KHÔNG có default

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 5000
        default-requeue-rejected: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  cache:
    type: redis

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false   # Instant -> "2026-09-19T10:15:30Z"

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

sentinelx:
  security:
    jwt:
      secret: ${JWT_SECRET}          # không có default: thiếu là app không khởi động
      expiration: ${JWT_EXPIRATION:60m}
      issuer: sentinelx
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  events:
    max-future-skew: 5m
    max-payload-bytes: 8192

  messaging:
    exchange: sentinelx.events
    dead-letter-exchange: sentinelx.events.dlx
    routing-key: event.created
    queue: sentinelx.events.detection
    dead-letter-queue: sentinelx.events.detection.dlq
  rate-limit:
    login:
      max-attempts: ${RATE_LIMIT_LOGIN_MAX_ATTEMPTS:5}
      window: ${RATE_LIMIT_LOGIN_WINDOW:15m}
---
spring:
  config:
    activate:
      on-profile: dev