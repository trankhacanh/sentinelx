name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Testcontainers cần Docker -- GitHub Actions ubuntu-latest runner có sẵn Docker daemon,
      # nên IntegrationTestBase (Phase 12) chạy được ngay không cần cấu hình gì thêm.
      - name: Run tests (unit + Testcontainers integration)
        run: mvn clean test -B

      - name: Build jar
        run: mvn clean package -DskipTests -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          # Placeholder -- giá trị thật phụ thuộc môi trường đích (staging/production), nằm
          # ngoài phạm vi kiểm tra "code có build được không" của CI.
          VITE_API_BASE_URL: http://localhost:8060
        run: npm run build