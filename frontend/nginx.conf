server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router dùng client-side routing -- mọi đường dẫn không khớp file tĩnh phải trả về
    # index.html để React tự xử lý route, nếu không sẽ bị Nginx trả 404 khi F5 ở trang con
    # (ví dụ /incidents/abc-123).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache tài nguyên tĩnh có hash trong tên file (Vite tự thêm hash khi build) dài hạn.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}